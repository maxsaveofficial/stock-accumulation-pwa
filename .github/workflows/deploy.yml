name: Deploy Stock Flow PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deno-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Deno Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check backend
        run: deno check main.ts

      - name: Deploy to Deno Deploy
        uses: denoland/deployctl@v1
        with:
          project: stock-accumulation-pwa
          entrypoint: main.ts
          root: .
